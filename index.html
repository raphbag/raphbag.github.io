<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link id="favicon" rel="icon" href="/favicon-dark.ico" type="image/x-icon">
  <script>
    const favicon = document.getElementById('favicon');
    const updateFavicon = (e) => {
      favicon.href = e.matches ? '/favicon-light.ico' : '/favicon-dark.ico';
    };
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    updateFavicon(prefersDark);
    prefersDark.addEventListener('change', updateFavicon);
  </script>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Raphaël Baguelin - Portfolio</title>
  <meta name="description"
    content="Portfolio de Raphael Baguelin, étudiant en cybersécurité. Découvrez mes projets en développement web, IoT, réseau et sécurité offensive/défensive." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://raphaelbaguelin.fr/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="Raphael Baguelin - Portfolio" />
  <meta property="og:title" content="Raphael Baguelin - Portfolio" />
  <meta property="og:description"
    content="Portfolio de Raphael Baguelin avec mes projets en cybersécurité, développement web, IoT et réseau." />
  <meta property="og:url" content="https://raphaelbaguelin.fr/" />
  <meta property="og:image" content="/logo.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Raphael Baguelin - Portfolio" />
  <meta name="twitter:description"
    content="Découvrez le portfolio de Raphael Baguelin : cybersécurité, réseau, IoT et développement web." />
  <meta name="twitter:image" content="/logo.svg" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Raphael Baguelin",
      "url": "https://raphaelbaguelin.fr/",
      "jobTitle": "Etudiant en cybersécurité",
      "image": "/logo.svg",
      "sameAs": ["https://github.com/raphbag"]
    }
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&display=swap" />
  <script>
    (function () {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect != location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
